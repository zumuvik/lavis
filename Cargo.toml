[package]
name = "lavis"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/zumuvik/lavis"
readme = "README.md"

[lib]
path = "src/app.rs"

[dependencies]
anyhow = "1.0"
grammers-client = "0.10.0"
grammers-mtsender = "0.10.0"
grammers-session = "0.10.0"
rpassword = "7.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1.1"
strip-ansi-escapes = "0.2.1"
thiserror = "2.0"
tokio = { version = "1.0", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
