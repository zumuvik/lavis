[package]
name = "lavis"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/zumuvik/lavis"
readme = "README.md"

[lib]
path = "src/app.rs"

[features]
default = []
fixture-tests = []

[dependencies]
anyhow = "1.0"
grammers-client = "0.10.0"
grammers-mtsender = "0.10.0"
grammers-session = "0.10.0"
getrandom = "0.3"
futures-util = "0.3"
rpassword = "7.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
shell-words = "1.1.1"
strip-ansi-escapes = "0.2.1"
thiserror = "2.0"
tokio = { version = "1.0", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustix = { version = "0.38.44", features = ["fs"] }
