name: Apply GAF implementation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/gaf.patch.part* | base64 --decode | gzip --decompress > /tmp/gaf.patch
          echo '62e07f7b3d8eb78a91dbb0c65cbe8342445b6e22d77ad12b64ee9120affcf92e  /tmp/gaf.patch' | sha256sum --check
          git apply --check /tmp/gaf.patch
          git apply /tmp/gaf.patch
          echo '' | base64 --decode | gzip --decompress > /tmp/gaf-fix.patch
          echo 'dd0ed0d60a8682c6893d746c7b194b76bfeef4c9ae3449f3b5b97361a6e72d10  /tmp/gaf-fix.patch' | sha256sum --check
          git apply --check /tmp/gaf-fix.patch
          git apply /tmp/gaf-fix.patch
          echo '' | base64 --decode | gzip --decompress > /tmp/gaf-command-protect.patch
          echo '35f09f0b7360e3bc303ad33b29ba6037fbbb16b7bfd713e61828e88e03bd7cb2  /tmp/gaf-command-protect.patch' | sha256sum --check
          git apply --check /tmp/gaf-command-protect.patch
          git apply /tmp/gaf-command-protect.patch
          sed -i 's/matches!(manifest.schema_version, 2 | 3 | 4)/matches!(manifest.schema_version, 2..=4)/' src/external_modules/manifest.rs
          rm -rf .agent .github/workflows/export-agent-source.yml
          git diff --check

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache-dependency-path: modules/gaf/go.sum

      - name: Test and package GAF
        shell: bash
        run: |
          set -euo pipefail
          cd modules/gaf
          go test ./...
          go vet ./...
          ./build-lmod.sh
          unzip -t dist/gaf.lmod
          test "$(unzip -Z1 dist/gaf.lmod | sort | tr '\n' ' ')" = 'gaf module.json '

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Format Rust
        run: |
          nix develop -c cargo fmt
          nix develop -c cargo fmt --check
          git diff --check

      - name: Check compilation
        run: nix develop -c cargo check --all-targets --all-features

      - name: Run Clippy
        run: nix develop -c cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: nix develop -c cargo test --all-targets --all-features

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Build Lavis
        run: nix build --print-build-logs

      - name: Validate packaged manifest
        run: ./result/bin/lavis modules validate modules/gaf/build/module.json

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Agent'
          git config user.email 'agent@openai.invalid'
          git add -A
          git add -f modules/gaf/dist/gaf.lmod
          git diff --cached --check
          git commit -m 'feat: add gaf reaction-trigger module'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
