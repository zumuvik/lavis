name: Apply GAF pipe syntax correction

on:
  push:
    branches:
      - agent/gaf-module
    paths:
      - .github/workflows/gaf-pipe-syntax.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gaf-module
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: modules/gaf/go.mod

      - name: Apply source and documentation changes
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          main = Path("modules/gaf/main.go")
          s = main.read_text()
          s = s.replace(
              "• gaf setr <слово> <1–3 реакции>",
              "• gaf setr <триггер> | <1–3 реакции>",
          )
          s = s.replace(
              "Premium-эмодзи можно вставить прямо в setr.",
              "Premium-эмодзи можно вставить справа от `|` прямо в setr.",
          )
          s = s.replace(
              "📭 Триггеров нет. Добавьте: gaf setr лайк 👍",
              "📭 Триггеров нет. Добавьте: gaf setr никс | 👍",
          )
          s = s.replace(
              'fmt.Fprintf(&b, "%s %d. %s → %s\\n", marker, item.ID, item.Word, formatReactions(item.Reactions))',
              'fmt.Fprintf(&b, "%s %d. %s | %s\\n", marker, item.ID, item.Word, formatReactions(item.Reactions))',
          )

          old_set = '''func (m *module) set(arguments string, entities []customEmojiEntity) (string, error) {
          \ttokens := tokenize(arguments)
          \tif len(tokens) < 2 {
          \t\treturn "", errors.New("использование: setr <слово> <реакция> [реакция] [реакция]")
          \t}
          \tword := strings.TrimSpace(tokens[0].Text)
          \tif word == "" || utf8.RuneCountInString(word) > 64 {
          \t\treturn "", errors.New("слово должно содержать от 1 до 64 символов")
          \t}
          \treactions, err := parseReactions(tokens[1:], entities)
          '''
          new_set = '''func (m *module) set(arguments string, entities []customEmojiEntity) (string, error) {
          \tword, reactionText, reactionOffset, err := splitTriggerRule(arguments)
          \tif err != nil {
          \t\treturn "", err
          \t}
          \tif utf8.RuneCountInString(word) > 64 {
          \t\treturn "", errors.New("триггер должен содержать от 1 до 64 символов")
          \t}
          \treactions, err := parseReactions(tokenize(reactionText), shiftEntities(entities, reactionOffset))
          '''
          if old_set not in s and "splitTriggerRule(arguments)" not in s:
              raise SystemExit("expected set parser block was not found")
          s = s.replace(old_set, new_set)
          s = s.replace(
              'return fmt.Sprintf("✅ Триггер «%s» → %s", word, formatReactions(reactions)), nil',
              'return fmt.Sprintf("✅ %s | %s", word, formatReactions(reactions)), nil',
          )

          helper = '''func splitTriggerRule(value string) (string, string, int, error) {
          \tpipe := strings.IndexRune(value, '|')
          \tif pipe < 0 {
          \t\treturn "", "", 0, errors.New("использование: setr <триггер> | <реакция> [реакция] [реакция]")
          \t}
          \tword := strings.TrimSpace(value[:pipe])
          \tright := value[pipe+1:]
          \treactionText := strings.TrimLeftFunc(right, unicode.IsSpace)
          \tif word == "" {
          \t\treturn "", "", 0, errors.New("триггер слева от | не может быть пустым")
          \t}
          \tif strings.TrimSpace(reactionText) == "" {
          \t\treturn "", "", 0, errors.New("укажите хотя бы одну реакцию справа от |")
          \t}
          \toffsetBytes := pipe + 1 + len(right) - len(reactionText)
          \toffsetUTF16 := len(utf16.Encode([]rune(value[:offsetBytes])))
          \treturn word, strings.TrimSpace(reactionText), offsetUTF16, nil
          }

          '''
          marker = "func parseReactions(tokens []token, entities []customEmojiEntity) ([]reaction, error) {"
          if "func splitTriggerRule(" not in s:
              if marker not in s:
                  raise SystemExit("parseReactions marker was not found")
              s = s.replace(marker, helper + marker)
          main.write_text(s)

          tests = Path("modules/gaf/main_test.go")
          t = tests.read_text()
          t = t.replace(
              'arguments := "setr лайк x"\n\tentityOffset := len(utf16.Encode([]rune("setr лайк ")))',
              'arguments := "setr никс | x"\n\tentityOffset := len(utf16.Encode([]rune("setr никс | ")))',
          )
          extra = '''

          func TestSetUsesPipeRuleAndSupportsMultiwordTrigger(t *testing.T) {
          \tm := module{
          \t\tpath:  filepath.Join(t.TempDir(), "state.json"),
          \t\tstate: state{Enabled: true, NextID: 1, Active: map[string]activeEntry{}},
          \t}
          \ttext, err := m.set("очень никс | 👍 ❤️", nil)
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tif text != "✅ очень никс | 👍 ❤️" {
          \t\tt.Fatalf("unexpected response: %q", text)
          \t}
          \tif len(m.state.Triggers) != 1 || m.state.Triggers[0].Word != "очень никс" {
          \t\tt.Fatalf("trigger: %#v", m.state.Triggers)
          \t}
          }

          func TestSetRejectsMissingPipe(t *testing.T) {
          \tm := module{
          \t\tpath:  filepath.Join(t.TempDir(), "state.json"),
          \t\tstate: state{Enabled: true, NextID: 1, Active: map[string]activeEntry{}},
          \t}
          \tif _, err := m.set("никс 👍", nil); err == nil {
          \t\tt.Fatal("missing pipe must be rejected")
          \t}
          }
          '''
          if "func TestSetUsesPipeRuleAndSupportsMultiwordTrigger" not in t:
              t += extra
          tests.write_text(t)

          readme = Path("modules/gaf/README.md")
          r = readme.read_text()
          r = r.replace(
              "`,gaf setr лайк 👍 ❤️` or `,gaf.setr лайк 👍 ❤️` — set one to three reactions;",
              "`,gaf setr никс | 👍 ❤️` or `,gaf.setr никс | 👍 ❤️` — set one to three reactions;",
          )
          r = r.replace(
              "Telegram Premium custom emoji can be pasted directly after the trigger word.\nFor diagnostics",
              "Rules use the explicit `trigger | reactions` format. Telegram Premium custom emoji can be pasted directly on the right side of `|`, for example `,gaf setr никс | <custom-emoji>`.\nFor diagnostics",
          )
          readme.write_text(r)

          manifest = Path("modules/gaf/module.json")
          data = json.loads(manifest.read_text())
          for command in data["commands"]:
              if command["name"] == "gaf":
                  command["examples"] = ["listt", "setr никс | 👍", "toggle off"]
              elif command["name"] == "setr":
                  command["description_ru"] = "Назначает триггеру слева от | от одной до трёх обычных или Premium-реакций справа."
                  command["usage"] = "<триггер> | <реакция> [реакция] [реакция]"
                  command["examples"] = ["никс | 👍", "очень никс | 🔥 ❤️", "премиум | <custom-emoji>"]
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY

          gofmt -w modules/gaf/main.go modules/gaf/main_test.go

      - name: Validate and rebuild package
        shell: bash
        run: |
          cd modules/gaf
          go test ./...
          go vet ./...
          ./build-lmod.sh
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("dist/gaf.lmod") as archive:
              assert archive.namelist() == ["module.json", "gaf"]
              assert ((archive.getinfo("gaf").external_attr >> 16) & 0o777) == 0o700
          PY

      - name: Commit correction
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/gaf/main.go modules/gaf/main_test.go modules/gaf/README.md modules/gaf/module.json modules/gaf/dist/gaf.lmod
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: use pipe-delimited gaf trigger rules"
          git push origin HEAD:agent/gaf-module
