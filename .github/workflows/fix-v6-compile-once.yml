name: Fix V6 Compile Once

on:
  push:
    branches:
      - feat/module-api-v6-full-telegram

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/module-api-v6-full-telegram

      - name: Apply compile fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {actual}')
              p.write_text(text.replace(old, new, count))

          replace('src/external_modules/v6_executor.rs', 'use grammers_session::Session;\n', '')
          replace(
              'src/external_modules/v6_executor.rs',
              '            None => self.raw_handle.session.home_dc_id(),\n',
              '            None => self\n                .raw_handle\n                .session\n                .home_dc_id()\n                .map_err(|_| V6ExecutorError::Transport)?,\n',
          )
          replace(
              'src/external_modules/v6_process.rs',
              '''        actor_tx,\n        mut reader,\n        mut writer,\n        mut stderr_drain,\n''',
              '''        actor_tx,\n        reader,\n        writer,\n        stderr_drain,\n''',
          )
          replace(
              'src/external_modules/v6_process.rs',
              '    let mut shutdown_reply = None;\n',
              '    let mut shutdown_reply: Option<oneshot::Sender<Result<(), ExternalError>>> = None;\n',
          )
          replace(
              'src/external_modules/v6_process.rs',
              '''                    let Some(request_id) = request_id(&frame) else { let _ = reply.send(Err(ExternalError::ProtocolEncode)); continue; };\n                    if pending.contains_key(request_id) { let _ = reply.send(Err(ExternalError::WrongRequestId)); continue; }\n                    if pending.len() == V6_MAX_PENDING { let _ = reply.send(Err(ExternalError::Unavailable)); continue; }\n                    if queue_writer(&writer_tx, WriterCommand::Frame(frame, Flush::None)).is_err() {\n                        let _ = reply.send(Err(ExternalError::Unavailable));\n                        break;\n                    }\n                    pending.insert(request_id.to_owned(), Pending { expected, deadline: Instant::now() + V6_LIFECYCLE_TIMEOUT, reply });\n''',
              '''                    let Some(request_id) = request_id(&frame).map(str::to_owned) else { let _ = reply.send(Err(ExternalError::ProtocolEncode)); continue; };\n                    if pending.contains_key(&request_id) { let _ = reply.send(Err(ExternalError::WrongRequestId)); continue; }\n                    if pending.len() == V6_MAX_PENDING { let _ = reply.send(Err(ExternalError::Unavailable)); continue; }\n                    if queue_writer(&writer_tx, WriterCommand::Frame(frame, Flush::None)).is_err() {\n                        let _ = reply.send(Err(ExternalError::Unavailable));\n                        break;\n                    }\n                    pending.insert(request_id, Pending { expected, deadline: Instant::now() + V6_LIFECYCLE_TIMEOUT, reply });\n''',
          )
          replace(
              'src/external_modules/v6_process.rs',
              '                    V6InboundFrame::Log { .. } => {}\n                },\n',
              '                    V6InboundFrame::Log { .. } => {}\n                    _ => break,\n                },\n',
          )
          replace(
              'src/external_modules/manager.rs',
              '''            assert_eq!(\n                process_start_kind(version, false),\n                Ok(ProcessStartKind::Legacy)\n            );''',
              '''            assert!(matches!(\n                process_start_kind(version, false),\n                Ok(ProcessStartKind::Legacy)\n            ));''',
          )
          replace(
              'src/external_modules/manager.rs',
              '        assert_eq!(process_start_kind(6, true), Ok(ProcessStartKind::V6));\n',
              '''        assert!(matches!(\n            process_start_kind(6, true),\n            Ok(ProcessStartKind::V6)\n        ));\n''',
          )
          replace(
              'src/external_modules/process.rs',
              '''            default_command: None,\n            subscriptions: Vec::new(),\n            actions: Vec::new(),\n            commands: vec![],\n        }\n    }\n\n    #[test]\n    fn push_keeps_all_bytes_below_the_limit()''',
              '''            default_command: None,\n            subscriptions: Vec::new(),\n            telegram_methods: Vec::new(),\n            actions: Vec::new(),\n            commands: vec![],\n        }\n    }\n\n    #[test]\n    fn push_keeps_all_bytes_below_the_limit()''',
          )
          PY

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Format and compile
        run: |
          nix develop -c cargo fmt
          nix develop -c cargo check --all-targets --all-features

      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.rs'
          git commit -m 'fix: compile Module API v6'
          git push origin HEAD:feat/module-api-v6-full-telegram
