name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Checkout GAF head for Nix artifact rebuild
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 23
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Rebuild GAF artifact with Nix toolchain
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 23
        shell: bash
        run: |
          set -euxo pipefail
          nix develop -c bash -c 'set -euo pipefail; cd modules/gaf; go test ./...; go vet ./...; ./build-lmod.sh; cp dist/gaf.lmod /tmp/gaf.lmod; ./build-lmod.sh; cmp /tmp/gaf.lmod dist/gaf.lmod'
          git checkout -- .github/workflows/ci.yml
          git add modules/gaf/dist/gaf.lmod
          if git diff --cached --quiet; then
            echo 'GAF artifact already matches the Nix toolchain'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'build: rebuild gaf artifact with nix toolchain'
          git push origin HEAD:agent/gaf-module

      - name: Test GAF module and artifact
        run: |
          cp modules/gaf/dist/gaf.lmod /tmp/gaf.lmod
          nix develop -c bash -c 'set -euo pipefail; test -z "$(gofmt -l modules/gaf/*.go)"; cd modules/gaf; go test ./...; go vet ./...; ./build-lmod.sh'
          cmp /tmp/gaf.lmod modules/gaf/dist/gaf.lmod
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('modules/gaf/dist/gaf.lmod') as archive:
              assert archive.namelist() == ['module.json', 'gaf']
              assert all(item.compress_type == zipfile.ZIP_STORED for item in archive.infolist())
              modes = {item.filename: (item.external_attr >> 16) & 0o777 for item in archive.infolist()}
              assert modes == {'module.json': 0o600, 'gaf': 0o700}, modes
          PY

      - name: Check formatting
        run: nix develop -c cargo fmt --check

      - name: Check compilation
        run: nix develop -c cargo check --all-targets --all-features

      - name: Run Clippy
        run: nix develop -c cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: nix develop -c cargo test --all-targets --all-features

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Build package
        run: nix build --print-build-logs
