name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Test GAF module and artifact
        run: |
          cp modules/gaf/dist/gaf.lmod /tmp/gaf.lmod
          nix develop -c bash -c 'set -euo pipefail; test -z "$(gofmt -l modules/gaf/*.go)"; cd modules/gaf; go test ./...; go vet ./...; ./build-lmod.sh'
          python3 - <<'PY'
          import zipfile

          expected_names = ['module.json', 'gaf']
          expected_modes = {'module.json': 0o600, 'gaf': 0o700}

          def inspect(path):
              with zipfile.ZipFile(path) as archive:
                  names = archive.namelist()
                  assert names == expected_names, (path, names)
                  assert all(
                      item.compress_type == zipfile.ZIP_STORED
                      for item in archive.infolist()
                  ), path
                  modes = {
                      item.filename: (item.external_attr >> 16) & 0o777
                      for item in archive.infolist()
                  }
                  assert modes == expected_modes, (path, modes)
                  return {name: archive.read(name) for name in expected_names}

          committed = inspect('/tmp/gaf.lmod')
          rebuilt = inspect('modules/gaf/dist/gaf.lmod')
          assert committed == rebuilt, (
              'committed gaf.lmod payload differs from the reproducible rebuild'
          )
          PY

      - name: Check formatting
        run: nix develop -c cargo fmt --check

      - name: Check compilation
        run: nix develop -c cargo check --all-targets --all-features

      - name: Run Clippy
        run: nix develop -c cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: nix develop -c cargo test --all-targets --all-features

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Build package
        run: nix build --print-build-logs
