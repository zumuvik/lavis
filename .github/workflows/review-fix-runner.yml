name: review-fix-runner

on:
  push:
    branches:
      - feat/module-api-v6-full-telegram

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/module-api-v6-full-telegram
          fetch-depth: 0
      - name: Run patch payload
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/review-fix-helper.yml').read_text()
          payload = text.split('        run: |\n', 1)[1]
          payload = '\n'.join(line[10:] if line.startswith('          ') else line for line in payload.splitlines()) + '\n'
          Path('/tmp/review-fix.sh').write_text(payload)
          PY
          bash /tmp/review-fix.sh
