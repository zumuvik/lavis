name: Fix V6 Clippy Once

on:
  push:
    branches:
      - feat/module-api-v6-full-telegram

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/module-api-v6-full-telegram

      - name: Apply V6 fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {actual}')
              p.write_text(text.replace(old, new, count))

          replace(
              'src/external_modules/v6_process.rs',
              '''    pub(crate) async fn event(\n        &self,\n        request_id: String,\n        event: MessageEventKind,\n        payload: MessageEvent,\n    ) -> Result<V6InboundFrame, ExternalError> {\n        self.request(\n            V6OutboundCoreFrame::Event {\n                request_id,\n                event,\n                payload,\n            },\n            Expected::EventResult,\n        )\n        .await\n    }\n\n    pub(crate) async fn shutdown(&self, request_id: String) -> Result<(), ExternalError> {\n''',
              '''    pub(crate) async fn event(\n        &self,\n        request_id: String,\n        event: MessageEventKind,\n        payload: MessageEvent,\n    ) -> Result<V6InboundFrame, ExternalError> {\n        self.request(\n            V6OutboundCoreFrame::Event {\n                request_id,\n                event,\n                payload,\n            },\n            Expected::EventResult,\n        )\n        .await\n    }\n\n    pub(crate) async fn health(\n        &self,\n        request_id: String,\n    ) -> Result<V6InboundFrame, ExternalError> {\n        self.request(\n            V6OutboundCoreFrame::Health { request_id },\n            Expected::Health,\n        )\n        .await\n    }\n\n    pub(crate) async fn shutdown(&self, request_id: String) -> Result<(), ExternalError> {\n''',
          )
          replace(
              'src/external_modules/v6_process.rs',
              '''        if let Some(event) = event {\n            if tx.send(event).await.is_err() {\n                return;\n            }\n        }\n''',
              '''        if let Some(event) = event\n            && tx.send(event).await.is_err()\n        {\n            return;\n        }\n''',
          )
          replace(
              'src/external_modules/v6_process.rs',
              '        message: "method is not allowlisted".to_owned(),\n',
              '        message: "gateway method is not recognized".to_owned(),\n',
          )
          replace(
              'src/external_modules/v6_executor.rs',
              '    if bytes.is_empty() || bytes.len() % 4 != 0 {\n',
              '    if bytes.is_empty() || !bytes.len().is_multiple_of(4) {\n',
          )
          replace(
              'src/external_modules/v6_executor.rs',
              '        if !last && (c_padding || d_padding) || c_padding && !d_padding {\n',
              '        if !last && d_padding || c_padding && !d_padding {\n',
          )
          replace(
              'src/external_modules/manager.rs',
              '''                                    Ok(super::protocol::V6InboundFrame::Initialized {\n                                        module_id,\n                                        ..\n                                    }) if module_id == id => Ok(ManagedProcess::V6(process)),\n''',
              '''                                    Ok(super::protocol::V6InboundFrame::Initialized {\n                                        module_id,\n                                        ..\n                                    }) if module_id == id => match process\n                                        .health(super::protocol::request_id())\n                                        .await\n                                    {\n                                        Ok(super::protocol::V6InboundFrame::Health { .. }) => {\n                                            Ok(ManagedProcess::V6(process))\n                                        }\n                                        Ok(_) => {\n                                            process.terminate().await;\n                                            Err(ExternalError::ProtocolDecode)\n                                        }\n                                        Err(error) => {\n                                            process.terminate().await;\n                                            Err(error)\n                                        }\n                                    },\n''',
          )
          replace(
              'src/external_modules/source_inspection.rs',
              '    /// `telegram.raw` grants reviewed RPC methods but does not sandbox a module.\n',
              '    /// `telegram.raw` grants raw Telegram RPC authority and does not sandbox a module.\n',
          )
          replace(
              'src/external_modules/source_inspection.rs',
              '            AcquiredLmod::archive(v6_archive("account.updateStatus")),\n',
              '            AcquiredLmod::archive(v6_archive("raw.invoke")),\n',
          )
          replace(
              'src/external_modules/source_inspection.rs',
              '            vec!["account.updateStatus".to_owned()]\n',
              '            vec!["raw.invoke".to_owned()]\n',
          )
          replace(
              'src/external_modules/manifest.rs',
              '            // This grants reviewed raw RPC methods, not a sandbox or generic API.\n            Self::TelegramRaw => "высокорисковые проверенные вызовы Telegram без песочницы",\n',
              '            // This grants arbitrary Telegram RPC authority, not a sandbox boundary.\n            Self::TelegramRaw => "полный доступ к Telegram RPC без песочницы",\n',
          )
          replace(
              'src/external_modules/manifest.rs',
              '''        assert!(matches!(\n            validate_manifest_at(&path, Some("echo")),\n            Err(ExternalError::InvalidArgument)\n        ));\n        fs::remove_dir_all(&base).unwrap();\n    }\n\n    #[test]\n    fn wrong_schema_version_rejected()''',
              '''        assert!(matches!(\n            validate_manifest_at(&path, Some("echo")),\n            Err(ExternalError::MalformedManifest)\n        ));\n        fs::remove_dir_all(&base).unwrap();\n    }\n\n    #[test]\n    fn wrong_schema_version_rejected()''',
          )
          replace(
              'src/external_modules/manifest.rs',
              '''        json["timer_subscriptions"] = serde_json::json!([]);\n        fs::write(&path, serde_json::to_vec(&json).unwrap()).unwrap();\n        assert!(matches!(\n            validate_manifest_at(&path, Some("echo")),\n            Err(ExternalError::InvalidArgument)\n        ));\n''',
              '''        json["timer_subscriptions"] = serde_json::json!([]);\n        fs::write(&path, serde_json::to_vec(&json).unwrap()).unwrap();\n        assert!(matches!(\n            validate_manifest_at(&path, Some("echo")),\n            Err(ExternalError::MalformedManifest)\n        ));\n''',
          )
          replace(
              'src/external_modules/manifest.rs',
              '''        json["subscriptions"] = serde_json::json!([{"type": "timer.tick", "interval_seconds": 30}]);\n        fs::write(&path, serde_json::to_vec(&json).unwrap()).unwrap();\n        assert!(matches!(\n            validate_manifest_at(&path, Some("echo")),\n            Err(ExternalError::InvalidArgument)\n        ));\n        for schema_version in 2..=4 {\n''',
              '''        json["subscriptions"] = serde_json::json!([{"type": "timer.tick", "interval_seconds": 30}]);\n        fs::write(&path, serde_json::to_vec(&json).unwrap()).unwrap();\n        assert!(matches!(\n            validate_manifest_at(&path, Some("echo")),\n            Err(ExternalError::MalformedManifest)\n        ));\n        for schema_version in 2..=4 {\n''',
          )
          replace(
              'src/external_modules/protocol.rs',
              '''    #[serde(rename = "telegram.invoke")]\n    TelegramInvoke {\n        protocol_version: u32,\n        call_id: String,\n        method: String,\n        params: Box<RawValue>,\n    },\n}\n\n#[derive(Deserialize)]\n#[serde(deny_unknown_fields)]\nstruct V6WireSuccess {\n''',
              '''}\n\n#[derive(Deserialize)]\n#[serde(deny_unknown_fields)]\nstruct V6WireInvoke {\n    protocol_version: u32,\n    #[serde(rename = "type")]\n    message_type: String,\n    call_id: String,\n    method: String,\n    params: Box<RawValue>,\n}\n\n#[derive(Deserialize)]\n#[serde(deny_unknown_fields)]\nstruct V6WireSuccess {\n''',
          )
          replace(
              'src/external_modules/protocol.rs',
              '''pub fn parse_v6_inbound_frame(line: &str) -> Result<V6InboundFrame, ExternalError> {\n    let wire: V6WireFrame = parse_v6_wire(line)?;\n    match wire {\n        V6WireFrame::Initialized {\n            protocol_version: 6,\n            request_id,\n            module_id,\n        } if is_v6_request_id(&request_id) => Ok(V6InboundFrame::Initialized {\n            request_id,\n            module_id,\n        }),\n        V6WireFrame::Result {\n            protocol_version: 6,\n            request_id,\n            text,\n        } if is_v6_request_id(&request_id) => Ok(V6InboundFrame::Result { request_id, text }),\n        V6WireFrame::Error {\n            protocol_version: 6,\n            request_id,\n            code,\n            message,\n        } if is_v6_request_id(&request_id) => Ok(V6InboundFrame::Error {\n            request_id,\n            code,\n            message,\n        }),\n        V6WireFrame::Health {\n            protocol_version: 6,\n            request_id,\n        } if is_v6_request_id(&request_id) => Ok(V6InboundFrame::Health { request_id }),\n        V6WireFrame::Log {\n            protocol_version: 6,\n            request_id,\n            level,\n            message,\n        } if is_v6_request_id(&request_id) => Ok(V6InboundFrame::Log {\n            request_id,\n            level,\n            message,\n        }),\n        V6WireFrame::EventResult {\n            protocol_version: 6,\n            request_id,\n            actions,\n        } if is_v6_request_id(&request_id) => Ok(V6InboundFrame::EventResult {\n            request_id,\n            actions,\n        }),\n        V6WireFrame::TelegramInvoke {\n            protocol_version: 6,\n            call_id,\n            method,\n            params,\n        } if is_v6_call_id(&call_id)\n            && !method.is_empty()\n            && validate_v6_raw_params(&params).is_ok() =>\n        {\n            Ok(V6InboundFrame::TelegramInvoke(\n                V6ModuleFrame::TelegramInvoke {\n                    call_id,\n                    method,\n                    params,\n                },\n            ))\n        }\n        _ => Err(ExternalError::ProtocolDecode),\n    }\n}\n\n''',
              '''pub fn parse_v6_inbound_frame(line: &str) -> Result<V6InboundFrame, ExternalError> {\n    let value = parse_v6_value(line)?;\n    if value.get("type").and_then(serde_json::Value::as_str) == Some("telegram.invoke") {\n        let wire: V6WireInvoke =\n            serde_json::from_str(line).map_err(|_| ExternalError::ProtocolDecode)?;\n        if wire.protocol_version == 6\n            && wire.message_type == "telegram.invoke"\n            && is_v6_call_id(&wire.call_id)\n            && !wire.method.is_empty()\n            && validate_v6_raw_params(&wire.params).is_ok()\n        {\n            return Ok(V6InboundFrame::TelegramInvoke(\n                V6ModuleFrame::TelegramInvoke {\n                    call_id: wire.call_id,\n                    method: wire.method,\n                    params: wire.params,\n                },\n            ));\n        }\n        return Err(ExternalError::ProtocolDecode);\n    }\n\n    let wire: V6WireFrame = parse_v6_wire(line)?;\n    match wire {\n        V6WireFrame::Initialized {\n            protocol_version: 6,\n            request_id,\n            module_id,\n        } if is_v6_request_id(&request_id) => Ok(V6InboundFrame::Initialized {\n            request_id,\n            module_id,\n        }),\n        V6WireFrame::Result {\n            protocol_version: 6,\n            request_id,\n            text,\n        } if is_v6_request_id(&request_id) => Ok(V6InboundFrame::Result { request_id, text }),\n        V6WireFrame::Error {\n            protocol_version: 6,\n            request_id,\n            code,\n            message,\n        } if is_v6_request_id(&request_id) => Ok(V6InboundFrame::Error {\n            request_id,\n            code,\n            message,\n        }),\n        V6WireFrame::Health {\n            protocol_version: 6,\n            request_id,\n        } if is_v6_request_id(&request_id) => Ok(V6InboundFrame::Health { request_id }),\n        V6WireFrame::Log {\n            protocol_version: 6,\n            request_id,\n            level,\n            message,\n        } if is_v6_request_id(&request_id) => Ok(V6InboundFrame::Log {\n            request_id,\n            level,\n            message,\n        }),\n        V6WireFrame::EventResult {\n            protocol_version: 6,\n            request_id,\n            actions,\n        } if is_v6_request_id(&request_id) => Ok(V6InboundFrame::EventResult {\n            request_id,\n            actions,\n        }),\n        _ => Err(ExternalError::ProtocolDecode),\n    }\n}\n\n''',
          )
          PY

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Format, lint and test
        run: |
          nix develop -c cargo fmt
          nix develop -c cargo clippy --all-targets --all-features -- -D warnings
          nix develop -c cargo test --all-targets --all-features

      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.rs'
          git commit -m 'fix: complete Module API v6 protocol contract'
          git push origin HEAD:feat/module-api-v6-full-telegram
