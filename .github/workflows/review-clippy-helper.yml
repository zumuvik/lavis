name: review-clippy-helper

on:
  push:
    branches:
      - feat/module-api-v6-full-telegram

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/module-api-v6-full-telegram
          fetch-depth: 0
      - name: Fix review clippy findings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/external_modules/v6_process.rs')
          text = p.read_text()
          for old in [
              '    ProtocolEncode,\n',
              '            Self::ProtocolEncode => ExternalError::ProtocolEncode,\n',
              '            Self::ProtocolEncode => "protocol_encode",\n',
              '                    closing = true;\n                    fail_pending(&mut pending);\n                    workers.abort_all();\n                    force_reply = Some(reply);\n',
          ]:
              if old not in text:
                  raise SystemExit(f'v6_process anchor missing: {old!r}')
          text = text.replace('    ProtocolEncode,\n', '', 1)
          text = text.replace('            Self::ProtocolEncode => ExternalError::ProtocolEncode,\n', '', 1)
          text = text.replace('            Self::ProtocolEncode => "protocol_encode",\n', '', 1)
          text = text.replace(
              '                    closing = true;\n                    fail_pending(&mut pending);\n                    workers.abort_all();\n                    force_reply = Some(reply);\n',
              '                    fail_pending(&mut pending);\n                    workers.abort_all();\n                    force_reply = Some(reply);\n',
              1,
          )
          old_call = '''        let diagnostics = process::build_crash_diagnostics_with_context(
                      &descriptor,
                      fatal_request_id.as_deref(),
                      &error,
                      &capture,
                      fatal_stage,
                      reason.category(),
                      exit_code,
                      exit_signal,
                      0,
                  );
          '''
          new_call = '''        let diagnostics = process::build_crash_diagnostics_with_context(
                      &descriptor,
                      fatal_request_id.as_deref(),
                      &error,
                      &capture,
                      process::CrashDiagnosticContext {
                          lifecycle_stage: fatal_stage,
                          error_category: reason.category(),
                          exit_code,
                          signal: exit_signal,
                          restart_generation: 0,
                      },
                  );
          '''
          if old_call not in text:
              raise SystemExit('v6 diagnostic call anchor missing')
          p.write_text(text.replace(old_call, new_call, 1))

          p = Path('src/external_modules/process.rs')
          text = p.read_text()
          old_legacy = '''    build_crash_diagnostics_with_context(
                  descriptor,
                  request_id,
                  error,
                  capture,
                  "runtime",
                  "runtime_failure",
                  None,
                  None,
                  0,
              )
          }

          pub(crate) fn build_crash_diagnostics_with_context(
              descriptor: &ExternalModuleDescriptor,
              request_id: Option<&str>,
              error: &ExternalError,
              capture: &StderrCapture,
              lifecycle_stage: &str,
              error_category: &str,
              exit_code: Option<i32>,
              signal: Option<i32>,
              restart_generation: u64,
          ) -> CrashDiagnostics {
          '''
          new_legacy = '''    build_crash_diagnostics_with_context(
                  descriptor,
                  request_id,
                  error,
                  capture,
                  CrashDiagnosticContext {
                      lifecycle_stage: "runtime",
                      error_category: "runtime_failure",
                      exit_code: None,
                      signal: None,
                      restart_generation: 0,
                  },
              )
          }

          pub(crate) struct CrashDiagnosticContext<'a> {
              pub(crate) lifecycle_stage: &'a str,
              pub(crate) error_category: &'a str,
              pub(crate) exit_code: Option<i32>,
              pub(crate) signal: Option<i32>,
              pub(crate) restart_generation: u64,
          }

          pub(crate) fn build_crash_diagnostics_with_context(
              descriptor: &ExternalModuleDescriptor,
              request_id: Option<&str>,
              error: &ExternalError,
              capture: &StderrCapture,
              context: CrashDiagnosticContext<'_>,
          ) -> CrashDiagnostics {
          '''
          if old_legacy not in text:
              raise SystemExit('process diagnostic builder anchor missing')
          text = text.replace(old_legacy, new_legacy, 1)
          for old, new in [
              ('        lifecycle_stage: lifecycle_stage.to_owned(),\n', '        lifecycle_stage: context.lifecycle_stage.to_owned(),\n'),
              ('        error_category: error_category.to_owned(),\n', '        error_category: context.error_category.to_owned(),\n'),
              ('        exit_code,\n', '        exit_code: context.exit_code,\n'),
              ('        signal,\n', '        signal: context.signal,\n'),
              ('        restart_generation,\n', '        restart_generation: context.restart_generation,\n'),
          ]:
              if old not in text:
                  raise SystemExit(f'context field anchor missing: {old!r}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY

          cargo fmt --all
          cargo check --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/external_modules/process.rs src/external_modules/v6_process.rs
          git commit -m 'fix: tighten v6 supervisor diagnostics implementation'
          git push origin HEAD:feat/module-api-v6-full-telegram
