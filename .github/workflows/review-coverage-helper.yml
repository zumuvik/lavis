name: review-coverage-helper

on:
  push:
    branches:
      - feat/module-api-v6-full-telegram

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/module-api-v6-full-telegram
          fetch-depth: 0
      - name: Add process-level review coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/external_modules/v6_process.rs')
          text = p.read_text()
          text = text.replace(
              '#[derive(Clone, Copy)]\nenum WriterQueueFailure {',
              '#[derive(Debug, Clone, Copy, PartialEq, Eq)]\nenum WriterQueueFailure {',
              1,
          )

          # A graceful shutdown is externally observable as Terminated as soon as
          # its successful reply is released; do not leave a tiny Running race.
          old = '''                            let result = shutdown_child_exit_result(true, stored_child_exit.take().expect("stored exit"));
                                      let clean = result.is_ok();
                                      if let Some(reply) = shutdown_reply.take() { let _ = reply.send(result); }
                                      if clean {
                                          terminal_status = process::ProcessStatus::Terminated;
                                      } else {
                                          fatal_reason = Some(FatalReason::Unavailable);
                                          fatal_stage = "shutdown";
                                      }
                                      break;
          '''
          new = '''                            let result = shutdown_child_exit_result(true, stored_child_exit.take().expect("stored exit"));
                                      let clean = result.is_ok();
                                      if clean {
                                          terminal_status = process::ProcessStatus::Terminated;
                                          lock_runtime_state(&runtime).status = process::ProcessStatus::Terminated;
                                      } else {
                                          fatal_reason = Some(FatalReason::Unavailable);
                                          fatal_stage = "shutdown";
                                      }
                                      if let Some(reply) = shutdown_reply.take() { let _ = reply.send(result); }
                                      break;
          '''
          if old not in text:
              raise SystemExit('first shutdown completion anchor missing')
          text = text.replace(old, new, 1)

          old2 = '''                            if let Some(child_exit) = stored_child_exit.take() {
                                          let result = shutdown_child_exit_result(true, child_exit);
                                          let clean = result.is_ok();
                                          if let Some(reply) = shutdown_reply.take() { let _ = reply.send(result); }
                                          if clean {
                                              terminal_status = process::ProcessStatus::Terminated;
                                          } else {
                                              fatal_reason = Some(FatalReason::Unavailable);
                                              fatal_stage = "shutdown";
                                          }
                                          break;
                                      }
          '''
          new2 = '''                            if let Some(child_exit) = stored_child_exit.take() {
                                          let result = shutdown_child_exit_result(true, child_exit);
                                          let clean = result.is_ok();
                                          if clean {
                                              terminal_status = process::ProcessStatus::Terminated;
                                              lock_runtime_state(&runtime).status = process::ProcessStatus::Terminated;
                                          } else {
                                              fatal_reason = Some(FatalReason::Unavailable);
                                              fatal_stage = "shutdown";
                                          }
                                          if let Some(reply) = shutdown_reply.take() { let _ = reply.send(result); }
                                          break;
                                      }
          '''
          if old2 not in text:
              raise SystemExit('second shutdown completion anchor missing')
          text = text.replace(old2, new2, 1)

          marker = '''    #[test]
              fn ungranted_method_is_rejected_before_executor() {
          '''
          if marker not in text:
              raise SystemExit('test insertion anchor missing')
          fixture = r'''    #[derive(Default)]
              struct RecordingExecutor {
                  methods: Mutex<Vec<v6_registry::V6Method>>,
              }

              impl V6TelegramExecutor for RecordingExecutor {
                  fn execute<'a>(
                      &'a self,
                      _context: V6ExecutionContext,
                      method: v6_registry::V6Method,
                      _params: Box<serde_json::value::RawValue>,
                  ) -> super::super::v6_executor::V6ExecutorFuture<'a> {
                      self.methods.lock().unwrap().push(method);
                      Box::pin(async {
                          super::super::v6_executor::V6RpcOutput::new(
                              serde_json::json!({"fixture": true}),
                          )
                      })
                  }
              }

              #[test]
              fn writer_queue_distinguishes_backpressure_from_closed_writer() {
                  let (writer, mut receiver) = mpsc::channel(1);
                  assert!(queue_writer(
                      &writer,
                      WriterCommand::Frame(
                          V6OutboundCoreFrame::Health { request_id: "1".to_owned() },
                          Flush::None,
                      ),
                  ).is_ok());
                  assert_eq!(
                      queue_writer(
                          &writer,
                          WriterCommand::Frame(
                              V6OutboundCoreFrame::Health { request_id: "2".to_owned() },
                              Flush::None,
                          ),
                      ),
                      Err(WriterQueueFailure::Backpressure),
                  );
                  assert!(receiver.try_recv().is_ok());
                  drop(receiver);
                  assert_eq!(
                      queue_writer(
                          &writer,
                          WriterCommand::Frame(
                              V6OutboundCoreFrame::Health { request_id: "3".to_owned() },
                              Flush::None,
                          ),
                      ),
                      Err(WriterQueueFailure::Closed),
                  );
              }

              #[cfg(unix)]
              #[tokio::test]
              async fn nonzero_shutdown_is_crash_and_retains_exit_and_stderr() {
                  use std::{fs, os::unix::fs::PermissionsExt};
                  let root = std::env::temp_dir().join(format!(
                      "lavis-v6-shutdown-{}-{}",
                      std::process::id(),
                      protocol::request_id()
                  ));
                  let _ = fs::remove_dir_all(&root);
                  fs::create_dir_all(&root).unwrap();
                  let entrypoint = root.join("run");
                  fs::write(&entrypoint, "#!/bin/sh\nread line\necho shutdown-broke >&2\nexit 7\n").unwrap();
                  fs::set_permissions(&entrypoint, fs::Permissions::from_mode(0o700)).unwrap();

                  let mut module = descriptor();
                  module.id = format!("v6badshutdown{}", std::process::id());
                  module.module_dir = root.clone();
                  module.entrypoint = entrypoint;
                  let process = V6Process::start(module, Arc::new(RecordingExecutor::default()))
                      .await
                      .unwrap();

                  assert!(matches!(
                      process.graceful_shutdown().await,
                      Err(ExternalError::Unavailable)
                  ));
                  for _ in 0..100 {
                      if process.status() == process::ProcessStatus::Crashed && process.diagnostic().is_some() {
                          break;
                      }
                      tokio::time::sleep(Duration::from_millis(10)).await;
                  }
                  assert_eq!(process.status(), process::ProcessStatus::Crashed);
                  let diagnostic = process.diagnostic().expect("crash diagnostic");
                  assert_eq!(diagnostic.lifecycle_stage, "shutdown");
                  assert_eq!(diagnostic.exit_code, Some(7));
                  assert_eq!(diagnostic.error_category, "unavailable");
                  assert!(diagnostic.stderr.contains("shutdown-broke"));
                  assert!(diagnostic.timestamp_unix_ms > 0);
                  let _ = fs::remove_dir_all(&root);
              }

              #[cfg(unix)]
              #[tokio::test]
              async fn force_terminate_kills_process_and_reports_terminated() {
                  use std::{fs, os::unix::fs::PermissionsExt};
                  let root = std::env::temp_dir().join(format!(
                      "lavis-v6-force-{}-{}",
                      std::process::id(),
                      protocol::request_id()
                  ));
                  let _ = fs::remove_dir_all(&root);
                  fs::create_dir_all(&root).unwrap();
                  let entrypoint = root.join("run");
                  fs::write(&entrypoint, "#!/bin/sh\necho $$ > leader.pid\nsleep 30\n").unwrap();
                  fs::set_permissions(&entrypoint, fs::Permissions::from_mode(0o700)).unwrap();

                  let mut module = descriptor();
                  module.id = format!("v6force{}", std::process::id());
                  module.module_dir = root.clone();
                  module.entrypoint = entrypoint;
                  let process = V6Process::start(module, Arc::new(RecordingExecutor::default()))
                      .await
                      .unwrap();
                  let pid_path = root.join("leader.pid");
                  for _ in 0..100 {
                      if pid_path.exists() { break; }
                      tokio::time::sleep(Duration::from_millis(10)).await;
                  }
                  let leader: i32 = fs::read_to_string(&pid_path).unwrap().trim().parse().unwrap();
                  process.terminate().await;
                  assert_eq!(process.status(), process::ProcessStatus::Terminated);
                  assert!(process.diagnostic().is_none());
                  let alive = unsafe { libc::kill(leader, 0) == 0 };
                  let _ = fs::remove_dir_all(&root);
                  assert!(!alive, "force-terminated module leader remained alive");
              }

              #[cfg(unix)]
              #[tokio::test]
              async fn real_child_conformance_covers_lifecycle_curated_and_raw_rpc() {
                  use std::{fs, os::unix::fs::PermissionsExt};
                  let root = std::env::temp_dir().join(format!(
                      "lavis-v6-conformance-{}-{}",
                      std::process::id(),
                      protocol::request_id()
                  ));
                  let _ = fs::remove_dir_all(&root);
                  fs::create_dir_all(&root).unwrap();
                  let entrypoint = root.join("run");

                  let mut module = descriptor();
                  module.id = format!("v6conformance{}", std::process::id());
                  module.module_dir = root.clone();
                  module.entrypoint = entrypoint.clone();
                  module.telegram_methods = vec![
                      v6_registry::V6Method::ContactsGetContacts,
                      v6_registry::V6Method::RawInvoke,
                  ];
                  module.capabilities.push(ExternalCapability::TelegramRaw);

                  let script = r#"#!/bin/sh
          req_id() {
            value=${1#*request_id}
            value=${value#*:}
            value=${value#*\"}
            value=${value%%\"*}
            printf '%s' "$value"
          }
          read line || exit 80
          rid=$(req_id "$line")
          printf '{"protocol_version":6,"type":"initialized","request_id":"%s","module_id":"__MODULE_ID__"}\n' "$rid"
          read line || exit 81
          rid=$(req_id "$line")
          printf '{"protocol_version":6,"type":"result","request_id":"%s","text":"ok"}\n' "$rid"
          read line || exit 82
          rid=$(req_id "$line")
          printf '{"protocol_version":6,"type":"event_result","request_id":"%s","actions":[]}\n' "$rid"
          printf '%s\n' '{"protocol_version":6,"type":"telegram.invoke","call_id":"curated-1","method":"contacts.getContacts","params":{"hash":"0"}}'
          read line || exit 83
          printf '%s\n' '{"protocol_version":6,"type":"telegram.invoke","call_id":"raw-1","method":"raw.invoke","params":{"body_base64_chunks":["eFY0EgEAAAA="]}}'
          read line || exit 84
          read line || exit 85
          rid=$(req_id "$line")
          printf '{"protocol_version":6,"type":"health","request_id":"%s"}\n' "$rid"
          read line || exit 86
          exit 0
          "#.replace("__MODULE_ID__", &module.id);
                  fs::write(&entrypoint, script).unwrap();
                  fs::set_permissions(&entrypoint, fs::Permissions::from_mode(0o700)).unwrap();

                  let executor = Arc::new(RecordingExecutor::default());
                  let process = V6Process::start(module.clone(), executor.clone()).await.unwrap();
                  assert!(matches!(
                      process.initialize("1".to_owned(), module.id.clone()).await.unwrap(),
                      V6InboundFrame::Initialized { .. }
                  ));
                  assert!(matches!(
                      process.execute("2".to_owned(), "run".to_owned(), String::new(), vec![]).await.unwrap(),
                      V6InboundFrame::Result { text, .. } if text == "ok"
                  ));
                  assert!(matches!(
                      process.event(
                          "3".to_owned(),
                          MessageEventKind::Created,
                          MessageEvent {
                              event_id: "e".to_owned(),
                              message_ref: "r".to_owned(),
                              message_key: "k".to_owned(),
                              peer_id: None,
                              text: "hello".to_owned(),
                              outgoing: false,
                              entities: vec![],
                          },
                      ).await.unwrap(),
                      V6InboundFrame::EventResult { .. }
                  ));

                  for _ in 0..200 {
                      if executor.methods.lock().unwrap().len() == 2 { break; }
                      tokio::time::sleep(Duration::from_millis(10)).await;
                  }
                  assert_eq!(
                      *executor.methods.lock().unwrap(),
                      vec![v6_registry::V6Method::ContactsGetContacts, v6_registry::V6Method::RawInvoke]
                  );
                  assert!(matches!(
                      process.health("4".to_owned()).await.unwrap(),
                      V6InboundFrame::Health { .. }
                  ));
                  process.graceful_shutdown().await.unwrap();
                  assert_eq!(process.status(), process::ProcessStatus::Terminated);
                  assert!(process.diagnostic().is_none());
                  let _ = fs::remove_dir_all(&root);
              }

          '''
          text = text.replace(marker, fixture + marker, 1)
          p.write_text(text)
          PY

          cargo fmt --all
          cargo check --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git commit -m 'test: cover v6 supervisor review acceptance paths'
          git push origin HEAD:feat/module-api-v6-full-telegram
