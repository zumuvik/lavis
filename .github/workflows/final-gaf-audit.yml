name: Final GAF audit fix

on:
  push:
    branches:
      - agent/gaf-module

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'

      - name: Apply and verify audited fixes
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euxo pipefail
            python3 .github/apply-final-gaf-audit.py
            python3 .github/apply-process-test-audit.py
            gofmt -w modules/gaf/main.go modules/gaf/main_test.go
            cd modules/gaf
            go test ./...
            go vet ./...
            ./build-lmod.sh
            cp dist/gaf.lmod /tmp/gaf.lmod
            ./build-lmod.sh
            cmp /tmp/gaf.lmod dist/gaf.lmod
            cd ../..
            python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('modules/gaf/dist/gaf.lmod') as archive:
              assert archive.namelist() == ['module.json', 'gaf']
              assert all(item.compress_type == zipfile.ZIP_STORED for item in archive.infolist())
              modes = {item.filename: (item.external_attr >> 16) & 0o777 for item in archive.infolist()}
              assert modes == {'module.json': 0o600, 'gaf': 0o700}, modes
          PY
          } 2>&1 | tee /tmp/gaf-audit.log

      - name: Publish audit result
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "${{ steps.audit.outcome }}" = "success" ]; then
            git rm .github/apply-final-gaf-audit.py .github/apply-process-test-audit.py .github/workflows/final-gaf-audit.yml
            git add -A
            git commit -m 'fix: resolve final gaf audit blockers'
          else
            cp /tmp/gaf-audit.log gaf-audit-failure.log 2>/dev/null || printf '%s\n' 'audit failed before a log was created' > gaf-audit-failure.log
            git rm .github/apply-final-gaf-audit.py .github/apply-process-test-audit.py .github/workflows/final-gaf-audit.yml
            git add -A
            git commit -m 'chore: capture gaf audit failure'
          fi
          git push origin HEAD:agent/gaf-module
