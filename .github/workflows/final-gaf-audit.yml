name: Final GAF audit fix

on:
  push:
    branches:
      - agent/gaf-module

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Apply audited fixes
        run: |
          python3 .github/apply-final-gaf-audit.py
          python3 .github/apply-process-test-audit.py

      - name: Format sources
        run: |
          nix develop -c gofmt -w modules/gaf/main.go modules/gaf/main_test.go
          nix develop -c cargo fmt --all

      - name: Verify GAF and rebuild artifact
        run: |
          nix develop -c bash -c 'set -euo pipefail; cd modules/gaf; go test ./...; go vet ./...; ./build-lmod.sh; cp dist/gaf.lmod /tmp/gaf.lmod; ./build-lmod.sh; cmp /tmp/gaf.lmod dist/gaf.lmod'
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('modules/gaf/dist/gaf.lmod') as archive:
              assert archive.namelist() == ['module.json', 'gaf']
              assert all(item.compress_type == zipfile.ZIP_STORED for item in archive.infolist())
              modes = {item.filename: (item.external_attr >> 16) & 0o777 for item in archive.infolist()}
              assert modes == {'module.json': 0o600, 'gaf': 0o700}, modes
          PY

      - name: Commit final audited changes
        run: |
          git rm .github/apply-final-gaf-audit.py .github/apply-process-test-audit.py .github/workflows/final-gaf-audit.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: resolve final gaf audit blockers'
          git push origin HEAD:agent/gaf-module
