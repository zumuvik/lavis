name: Apply GAF audit fixes

on:
  push:
    branches:
      - agent/gaf-module

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Apply audited fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}, got {text.count(old)}")
              file.write_text(text.replace(old, new, 1))

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              begin = text.index(start)
              finish = text.index(end, begin)
              file.write_text(text[:begin] + replacement + text[finish:])

          replace_once(
              "modules/gaf/main.go",
              'Revision  uint64     `json:"revision"`',
              'Revision  uint64     `json:"-"`',
          )

          replace_between(
              "modules/gaf/main.go",
              "func (m *module) toggle(arguments string) (string, error) {",
              "func (m *module) handleEvent(event string, payload eventPayload) []eventAction {",
              r'''func (m *module) toggle(arguments string) (string, error) {
          arguments = strings.TrimSpace(arguments)
          if arguments == "" || isSwitch(arguments) {
              value := !m.state.Enabled
              if arguments != "" {
                  value = switchValue(arguments, value)
              }
              m.state.Enabled = value
              if err := m.save(); err != nil {
                  return "", err
              }
              return fmt.Sprintf("GAF: %s", onOff(value)), nil
          }

          key := arguments
          requestedSwitch := ""
          fields := strings.Fields(arguments)
          if len(fields) > 1 && isSwitch(fields[len(fields)-1]) {
              requestedSwitch = fields[len(fields)-1]
              suffixStart := strings.LastIndex(arguments, requestedSwitch)
              key = strings.TrimSpace(arguments[:suffixStart])
          }
          if key == "" {
              return "", errors.New("использование: toggle <номер|триггер> [on|off]")
          }
          index := m.findTrigger(key)
          if index < 0 {
              return "", errors.New("триггер не найден")
          }
          value := !m.state.Triggers[index].Enabled
          if requestedSwitch != "" {
              value = switchValue(requestedSwitch, value)
          }
          m.state.Triggers[index].Enabled = value
          if err := m.save(); err != nil {
              return "", err
          }
          return fmt.Sprintf("Триггер «%s»: %s", m.state.Triggers[index].Word, onOff(value)), nil
          }

          ''',
          )

          replace_between(
              "modules/gaf/main.go",
              "func (m *module) handleEvent(event string, payload eventPayload) []eventAction {",
              "func (m *module) reactionsFor(text string) []reaction {",
              r'''func (m *module) handleEvent(event string, payload eventPayload) []eventAction {
          if !m.state.Enabled || payload.MessageRef == "" || payload.MessageKey == "" {
              return nil
          }
          revision, _ := strconv.ParseUint(payload.EventID, 10, 64)
          previous, known := m.state.Active[payload.MessageKey]
          if known && revision != 0 && previous.Revision != 0 && revision <= previous.Revision {
              return nil
          }

          desired := m.reactionsFor(payload.Text)
          now := time.Now().Unix()
          entry := activeEntry{Reactions: desired, Revision: revision, SeenAt: now}
          if len(desired) == 0 {
              if event == "message.created" && !known {
                  return nil
              }
              shouldRemove := event == "message.edited" && known && len(previous.Reactions) > 0
              m.state.Active[payload.MessageKey] = entry
              m.pruneActive()
              m.saveEventState()
              if !shouldRemove {
                  return nil
              }
              return []eventAction{{Type: "message.react", MessageRef: payload.MessageRef, Reactions: []reaction{}}}
          }
          if known && equalReactions(previous.Reactions, desired) {
              m.state.Active[payload.MessageKey] = entry
              m.saveEventState()
              return nil
          }
          m.state.Active[payload.MessageKey] = entry
          m.pruneActive()
          m.saveEventState()
          return []eventAction{{Type: "message.react", MessageRef: payload.MessageRef, Reactions: desired}}
          }

          func (m *module) saveEventState() {
              if err := m.save(); err != nil {
                  fmt.Fprintln(os.Stderr, err)
              }
          }

          ''',
          )

          replace_once(
              "modules/gaf/main.go",
              '''\t\t} else if id, ok := customID(item.Text); ok {
          \t\t\tvalue = reaction{Type: "custom_emoji", DocumentID: id}
          \t\t} else {''',
              '''\t\t} else if hasCustomIDPrefix(item.Text) {
          \t\t\tid, ok := customID(item.Text)
          \t\t\tif !ok {
          \t\t\t\treturn nil, errors.New("некорректный Premium emoji document_id")
          \t\t\t}
          \t\t\tvalue = reaction{Type: "custom_emoji", DocumentID: id}
          \t\t} else {''',
          )

          replace_once(
              "modules/gaf/main.go",
              '''func customID(value string) (string, bool) {
          \tlower := strings.ToLower(value)''',
              '''func hasCustomIDPrefix(value string) bool {
          \tlower := strings.ToLower(value)
          \treturn strings.HasPrefix(lower, "ce:") || strings.HasPrefix(lower, "custom:")
          }

          func customID(value string) (string, bool) {
          \tlower := strings.ToLower(value)''',
          )

          replace_once(
              "modules/gaf/main_test.go",
              '''import (
          \t"path/filepath"
          \t"testing"
          \t"unicode/utf16"
          )''',
              '''import (
          \t"encoding/json"
          \t"path/filepath"
          \t"strings"
          \t"testing"
          \t"unicode/utf16"
          )''',
          )

          tests = r'''
          func TestToggleSupportsMultiwordTrigger(t *testing.T) {
          \tm := module{
          \t\tpath: filepath.Join(t.TempDir(), "state.json"),
          \t\tstate: state{
          \t\t\tEnabled: true,
          \t\t\tNextID:  2,
          \t\t\tTriggers: []trigger{{
          \t\t\t\tID: 1, Word: "очень никс", Enabled: true,
          \t\t\t\tReactions: []reaction{{Type: "emoji", Emoji: "👍"}},
          \t\t\t}},
          \t\t\tActive: map[string]activeEntry{},
          \t\t},
          \t}
          \tif _, err := m.toggle("очень никс off"); err != nil {
          \t\tt.Fatal(err)
          \t}
          \tif m.state.Triggers[0].Enabled {
          \t\tt.Fatal("multiword trigger should be disabled")
          \t}
          }

          func TestRuntimeRevisionIsNotPersisted(t *testing.T) {
          \tm := testModule(t)
          \tm.state.Active["stable"] = activeEntry{
          \t\tReactions: []reaction{{Type: "emoji", Emoji: "👍"}},
          \t\tRevision:  999,
          \t\tSeenAt:    1,
          \t}
          \tdata, err := json.Marshal(m.state)
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tif strings.Contains(string(data), `"revision"`) {
          \t\tt.Fatalf("runtime revision leaked into state: %s", data)
          \t}
          \tvar restored state
          \tif err := json.Unmarshal(data, &restored); err != nil {
          \t\tt.Fatal(err)
          \t}
          \trestarted := module{path: filepath.Join(t.TempDir(), "state.json"), state: restored}
          \tactions := restarted.handleEvent("message.edited", eventPayload{
          \t\tEventID: "1", MessageRef: "edited", MessageKey: "stable", Text: "без триггера",
          \t})
          \tif len(actions) != 1 || actions[0].Reactions == nil || len(actions[0].Reactions) != 0 {
          \t\tt.Fatalf("restart must accept the new edit and remove reactions: %#v", actions)
          \t}
          }

          func TestCreatedNonMatchDoesNotPopulateActiveState(t *testing.T) {
          \tm := testModule(t)
          \tactions := m.handleEvent("message.created", eventPayload{
          \t\tEventID: "10", MessageRef: "created", MessageKey: "no-match", Text: "обычное сообщение",
          \t})
          \tif len(actions) != 0 || len(m.state.Active) != 0 {
          \t\tt.Fatalf("nonmatching created event should be ignored: actions=%#v active=%#v", actions, m.state.Active)
          \t}
          }

          func TestMalformedCustomIDIsRejected(t *testing.T) {
          \tif _, err := parseReactions([]token{{Text: "ce:not-a-number"}}, nil); err == nil {
          \t\tt.Fatal("malformed diagnostic custom emoji ID must be rejected")
          \t}
          }
          '''
          Path("modules/gaf/main_test.go").write_text(Path("modules/gaf/main_test.go").read_text() + tests)

          old_projection = '''    if should_prepare_message_event(event_protected) {
              let event = if edited {
                  crate::external_modules::protocol::MessageEventKind::Edited
              } else {
                  crate::external_modules::protocol::MessageEventKind::Created
              };
              let entities = crate::external_modules::entities::project_custom_emoji_entities(
                  message.fmt_entities(),
                  0,
                  message.text().encode_utf16().count(),
              );'''
          new_projection = '''    // New command/setup messages stay private. If an already-projected message is
              // edited into protected content, emit a redacted edit so modules can
              // reconcile prior actions without receiving the command text.
              if should_prepare_message_event(edited, event_protected) {
                  let event = if edited {
                      crate::external_modules::protocol::MessageEventKind::Edited
                  } else {
                      crate::external_modules::protocol::MessageEventKind::Created
                  };
                  let event_text = if event_protected { "" } else { message.text() };
                  let entities = if event_protected {
                      Vec::new()
                  } else {
                      crate::external_modules::entities::project_custom_emoji_entities(
                          message.fmt_entities(),
                          0,
                          message.text().encode_utf16().count(),
                      )
                  };'''
          replace_once("src/updates.rs", old_projection, new_projection)
          replace_once(
              "src/updates.rs",
              '''            message.text(),
                  outgoing,
                  entities,''',
              '''            event_text,
                  outgoing,
                  entities,''',
          )
          replace_once(
              "src/updates.rs",
              '''fn should_prepare_message_event(event_protected: bool) -> bool {
              !event_protected
          }''',
              '''fn should_prepare_message_event(edited: bool, event_protected: bool) -> bool {
              edited || !event_protected
          }''',
          )
          replace_once(
              "src/updates.rs",
              '''        assert!(!should_prepare_message_event(true));
                  assert!(should_prepare_message_event(false));''',
              '''        assert!(!should_prepare_message_event(false, true));
                  assert!(should_prepare_message_event(true, true));
                  assert!(should_prepare_message_event(false, false));
                  assert!(should_prepare_message_event(true, false));''',
          )

          replace_once(
              "docs/module-api-v4.md",
              '''`message_key` is stable for the same Telegram message and module across
          `message.created` and `message.edited`; modules may use it as a reconciliation
          key. Neither value exposes the Telegram peer or message ID.
          ''',
              '''`message_key` is stable for the same Telegram message and module across
          `message.created` and `message.edited`; modules may use it as a reconciliation
          key. Neither value exposes the Telegram peer or message ID.

          New Lavis command/setup messages are not projected to modules. If a previously
          projected message is edited into protected command/setup content, v4 subscribers
          receive a redacted `message.edited` event with empty `text` and `entities`, allowing
          them to remove prior actions without receiving the protected command text.
          ''',
          )

          Path("modules/gaf/build-lmod.sh").write_text('''#!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"
          rm -rf build
          mkdir -p build dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o build/gaf .
          chmod 700 build/gaf
          cp module.json build/module.json
          chmod 600 build/module.json
          TZ=UTC touch -t 198001010000 build/gaf build/module.json
          rm -f dist/gaf.lmod
          (
            cd build
            zip -q -0 -X ../dist/gaf.lmod module.json gaf
          )
          printf 'built %s\\n' "$(realpath dist/gaf.lmod)"
          ''')

          replace_once(
              "flake.nix",
              '''          python3 # JSON-line external-process fixtures
              ''',
              '''          python3 # JSON-line external-process fixtures
                        go
                        zip
              ''',
          )

          replace_once(
              ".github/workflows/ci.yml",
              '''      - name: Check formatting
                  run: nix develop -c cargo fmt --check
          ''',
              '''      - name: Test GAF module
                  run: |
                    cp modules/gaf/dist/gaf.lmod /tmp/gaf.lmod
                    nix develop -c bash -c 'set -euo pipefail; test -z "$(gofmt -l modules/gaf)"; cd modules/gaf; go test ./...; go vet ./...; ./build-lmod.sh'
                    cmp /tmp/gaf.lmod modules/gaf/dist/gaf.lmod

                - name: Check formatting
                  run: nix develop -c cargo fmt --check
          ''',
          )
          PY

      - name: Format and validate
        shell: bash
        run: |
          nix develop -c gofmt -w modules/gaf/main.go modules/gaf/main_test.go
          nix develop -c bash -c 'set -euo pipefail; cd modules/gaf; go test ./...; go vet ./...; ./build-lmod.sh'
          nix develop -c cargo fmt --all
          nix develop -c cargo check --all-targets --all-features
          nix develop -c cargo clippy --all-targets --all-features -- -D warnings
          nix develop -c cargo test --all-targets --all-features
          nix flake check --print-build-logs
          nix build --print-build-logs

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/audit-fix-gaf.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: address gaf audit findings'
          git push origin HEAD:agent/gaf-module
