name: Publish PR28 Source Fixes

on:
  push:
    branches:
      - feat/module-api-v6-full-telegram

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/module-api-v6-full-telegram

      - name: Reuse reviewed patch script
        run: |
          awk '
            /^      - name: Apply review fixes$/ { found=1; next }
            found && /^        run: \|$/ { capture=1; next }
            capture && /^      - name: Install Nix$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/fix-pr28-review.yml > /tmp/apply-pr28-review.sh
          bash /tmp/apply-pr28-review.sh

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Validate source fixes
        run: |
          nix develop -c cargo fmt
          python3 tools/generate_v6_registry.py --check
          nix develop -c cargo check --all-targets --all-features
          nix develop -c cargo clippy --all-targets --all-features -- -D warnings
          nix develop -c cargo test --all-targets --all-features

      - name: Commit source fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/external_modules/process.rs src/external_modules/v6_process.rs src/external_modules/manifest.rs src/external_modules/v6_executor.rs src/updates.rs
          git commit -m 'fix: address Module API v6 review blockers'
          git push origin HEAD:feat/module-api-v6-full-telegram
