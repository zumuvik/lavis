name: Fix PR28 Fixtures

on:
  push:
    branches:
      - feat/module-api-v6-full-telegram

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/module-api-v6-full-telegram

      - name: Fix fixtures and add descendant regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {actual}')
              p.write_text(text.replace(old, new, count))

          replace(
              'src/external_modules/source_inspection.rs',
              '''    fn v6_archive(method: &str) -> Vec<u8> {\n        let manifest = file(\n            "module.json",\n            format!(\n                "{{\\\"schema_version\\\":6,\\\"id\\\":\\\"raw\\\",\\\"name\\\":\\\"Raw\\\",\\\"version\\\":\\\"1\\\",\\\"author\\\":\\\"A\\\",\\\"entrypoint\\\":\\\"run\\\",\\\"capabilities\\\":[\\\"telegram.raw\\\"],\\\"telegram_methods\\\":[\\\"{method}\\\"],\\\"commands\\\":[{{\\\"name\\\":\\\"go\\\",\\\"summary_ru\\\":\\\"x\\\",\\\"description_ru\\\":\\\"x\\\",\\\"usage\\\":\\\"<value>\\\"}}]}}"\n            )\n            .as_bytes(),\n        );\n''',
              '''    fn v6_archive(method: &str) -> Vec<u8> {\n        let capabilities = if method == "raw.invoke" {\n            r#"["telegram.raw"]"#\n        } else {\n            "[]"\n        };\n        let manifest = file(\n            "module.json",\n            format!(\n                "{{\\\"schema_version\\\":6,\\\"id\\\":\\\"raw\\\",\\\"name\\\":\\\"Raw\\\",\\\"version\\\":\\\"1\\\",\\\"author\\\":\\\"A\\\",\\\"entrypoint\\\":\\\"run\\\",\\\"capabilities\\\":{capabilities},\\\"telegram_methods\\\":[\\\"{method}\\\"],\\\"commands\\\":[{{\\\"name\\\":\\\"go\\\",\\\"summary_ru\\\":\\\"x\\\",\\\"description_ru\\\":\\\"x\\\",\\\"usage\\\":\\\"<value>\\\"}}]}}"\n            )\n            .as_bytes(),\n        );\n''',
          )

          replace(
              'src/external_modules/v6_process.rs',
              '''    #[tokio::test]\n    async fn pending_deadline_is_absolute_under_event_activity() {\n        let mut pending = HashMap::new();\n        let (reply, _receiver) = oneshot::channel();\n        pending.insert(\n            "1".to_owned(),\n            Pending {\n                expected: Expected::Health,\n                deadline: Instant::now(),\n                reply,\n            },\n        );\n        tokio::time::timeout(\n            Duration::from_millis(20),\n            sleep_until_pending_deadline(&pending),\n        )\n        .await\n        .unwrap();\n    }\n}\n''',
              '''    #[tokio::test]\n    async fn pending_deadline_is_absolute_under_event_activity() {\n        let mut pending = HashMap::new();\n        let (reply, _receiver) = oneshot::channel();\n        pending.insert(\n            "1".to_owned(),\n            Pending {\n                expected: Expected::Health,\n                deadline: Instant::now(),\n                reply,\n            },\n        );\n        tokio::time::timeout(\n            Duration::from_millis(20),\n            sleep_until_pending_deadline(&pending),\n        )\n        .await\n        .unwrap();\n    }\n\n    #[cfg(unix)]\n    #[tokio::test]\n    async fn supervisor_kills_descendant_after_leader_exit() {\n        use std::{fs, os::unix::fs::PermissionsExt};\n\n        struct NoopExecutor;\n        impl V6TelegramExecutor for NoopExecutor {\n            fn execute<'a>(\n                &'a self,\n                _context: V6ExecutionContext,\n                _method: v6_registry::V6Method,\n                _params: Box<serde_json::value::RawValue>,\n            ) -> super::super::v6_executor::V6ExecutorFuture<'a> {\n                Box::pin(async { Err(V6ExecutorError::Transport) })\n            }\n        }\n\n        let root = std::env::temp_dir().join(format!(\n            "lavis-v6-descendant-{}-{}",\n            std::process::id(),\n            protocol::request_id()\n        ));\n        let _ = fs::remove_dir_all(&root);\n        fs::create_dir_all(&root).unwrap();\n        let entrypoint = root.join("run");\n        fs::write(\n            &entrypoint,\n            "#!/bin/sh\\nsleep 30 &\\necho $! > child.pid\\nexit 0\\n",\n        )\n        .unwrap();\n        fs::set_permissions(&entrypoint, fs::Permissions::from_mode(0o700)).unwrap();\n\n        let mut module = descriptor();\n        module.id = format!("v6desc{}", std::process::id());\n        module.module_dir = root.clone();\n        module.entrypoint = entrypoint;\n        let process = V6Process::start(module, Arc::new(NoopExecutor))\n            .await\n            .unwrap();\n\n        let pid_path = root.join("child.pid");\n        for _ in 0..100 {\n            if pid_path.exists() {\n                break;\n            }\n            tokio::time::sleep(Duration::from_millis(10)).await;\n        }\n        let descendant: i32 = fs::read_to_string(&pid_path).unwrap().trim().parse().unwrap();\n\n        for _ in 0..100 {\n            if process.status() == super::super::process::ProcessStatus::Crashed {\n                break;\n            }\n            tokio::time::sleep(Duration::from_millis(10)).await;\n        }\n        assert_eq!(\n            process.status(),\n            super::super::process::ProcessStatus::Crashed\n        );\n\n        let mut alive = true;\n        for _ in 0..200 {\n            let result = unsafe { libc::kill(descendant, 0) };\n            alive = result == 0\n                || std::io::Error::last_os_error().raw_os_error() != Some(libc::ESRCH);\n            if !alive {\n                break;\n            }\n            tokio::time::sleep(Duration::from_millis(10)).await;\n        }\n        if alive {\n            unsafe {\n                let _ = libc::kill(descendant, libc::SIGKILL);\n            }\n        }\n        let _ = fs::remove_dir_all(&root);\n        assert!(!alive, "descendant process survived v6 supervisor cleanup");\n    }\n}\n''',
          )
          PY

      - name: Commit fixture fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/external_modules/source_inspection.rs src/external_modules/v6_process.rs
          git commit -m 'test: cover v6 least privilege and descendant cleanup'
          git push origin HEAD:feat/module-api-v6-full-telegram
