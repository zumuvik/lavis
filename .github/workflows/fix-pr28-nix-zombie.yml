name: Fix PR28 Nix Zombie

on:
  push:
    branches:
      - feat/module-api-v6-full-telegram

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/module-api-v6-full-telegram

      - name: Make descendant assertion zombie-aware
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/external_modules/v6_process.rs')
          text = p.read_text()
          old = '''        let mut alive = true;\n        for _ in 0..200 {\n            let result = unsafe { libc::kill(descendant, 0) };\n            alive = result == 0\n                || std::io::Error::last_os_error().raw_os_error() != Some(libc::ESRCH);\n            if !alive {\n                break;\n            }\n            tokio::time::sleep(Duration::from_millis(10)).await;\n        }\n        if alive {\n            unsafe {\n                let _ = libc::kill(descendant, libc::SIGKILL);\n            }\n        }\n        let _ = fs::remove_dir_all(&root);\n        assert!(!alive, "descendant process survived v6 supervisor cleanup");\n'''
          new = '''        fn descendant_is_live(pid: i32) -> bool {\n            let proc_stat = std::fs::read_to_string(format!("/proc/{pid}/stat"));\n            match proc_stat {\n                Ok(stat) => {\n                    // `/proc/<pid>/stat` is `pid (comm) state ...`; comm may\n                    // contain spaces or parentheses, so find the final `) `.\n                    // A zombie has already been killed and cannot execute or\n                    // retain module resources; in a PID namespace its init is\n                    // responsible for the eventual wait/reap.\n                    let Some(after_comm) = stat.rsplit_once(") ").map(|(_, tail)| tail) else {\n                        return true;\n                    };\n                    !after_comm.starts_with('Z')\n                }\n                Err(error) if error.kind() == std::io::ErrorKind::NotFound => false,\n                Err(_) => true,\n            }\n        }\n\n        let mut alive = true;\n        for _ in 0..200 {\n            alive = descendant_is_live(descendant);\n            if !alive {\n                break;\n            }\n            tokio::time::sleep(Duration::from_millis(10)).await;\n        }\n        if alive {\n            unsafe {\n                let _ = libc::kill(descendant, libc::SIGKILL);\n            }\n        }\n        let _ = fs::remove_dir_all(&root);\n        assert!(\n            !alive,\n            "live descendant process survived v6 supervisor cleanup"\n        );\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one descendant assertion block, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Validate
        run: |
          nix develop -c cargo fmt
          nix develop -c cargo test external_modules::v6_process::tests::supervisor_kills_descendant_after_leader_exit --all-features
          nix flake check --print-build-logs

      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/external_modules/v6_process.rs
          git commit -m 'test: distinguish terminated descendants from zombies'
          git push origin HEAD:feat/module-api-v6-full-telegram
