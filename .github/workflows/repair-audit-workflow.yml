name: Repair GAF audit workflow

on:
  push:
    branches:
      - agent/gaf-module

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Repair generator and remove this workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/audit-fix-gaf.yml')
          text = path.read_text()
          old = "          tests = r'''"
          new = "          tests = '''"
          if text.count(old) != 1:
              raise SystemExit(f'expected one raw tests string, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/repair-audit-workflow.yml
          git add .github/workflows/audit-fix-gaf.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore: fix gaf audit test generator'
          git push origin HEAD:agent/gaf-module
