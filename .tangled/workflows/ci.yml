name: CI

when:
  - event: push
    branch: ["**"]
  - event: pull_request
    branch: ["**"]
  - event: manual

engine: nixery

dependencies:
  nixpkgs:
    - bash
    - coreutils
    - git
    - go
    - nix
    - python3

steps:
  - name: Test bundled Go modules
    command: |
      bash -euo pipefail <<'BASH'
      for module in modules/*/; do
        test -f "$module/go.mod" || continue
        echo "== $module"
        (
          cd "$module"
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed: $unformatted" >&2
            exit 1
          fi
          go vet ./...
          go test ./...
        )
      done
      BASH

  - name: Check generated v6 registry
    command: |
      bash -euo pipefail <<'BASH'
      python3 tools/generate_v6_registry.py --check
      BASH

  - name: Check formatting
    command: |
      bash -euo pipefail <<'BASH'
      nix develop -c cargo fmt --check
      BASH

  - name: Check compilation
    command: |
      bash -euo pipefail <<'BASH'
      nix develop -c cargo check --all-targets --all-features
      BASH

  - name: Run Clippy
    command: |
      bash -euo pipefail <<'BASH'
      nix develop -c cargo clippy --all-targets --all-features -- -D warnings
      BASH

  - name: Run tests
    command: |
      bash -euo pipefail <<'BASH'
      nix develop -c cargo test --all-targets --all-features
      BASH

  - name: Check flake
    command: |
      bash -euo pipefail <<'BASH'
      nix flake check --print-build-logs
      BASH

  - name: Build package
    command: |
      bash -euo pipefail <<'BASH'
      nix build --print-build-logs
      BASH

  - name: Build module .lmod archives
    command: |
      bash -euo pipefail <<'BASH'
      nix build --print-build-logs \
        .#lavis-lmod-cleaner \
        .#lavis-lmod-gaf \
        .#lavis-lmod-zai \
        .#lavis-lmod-remotefetch
      BASH
