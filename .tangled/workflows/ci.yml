name: CI

when:
  - event: push
    branch: ["**"]
  - event: pull_request
    branch: ["**"]
  - event: manual

engine: nixery

dependencies:
  nixpkgs:
    - bash
    - coreutils
    - git
    - go
    - nix
    - python3

steps:
  - name: Test GAF module
    command: |
      bash -euo pipefail <<'BASH'
      cd modules/gaf
      test -z "$(gofmt -l *.go)"
      go vet ./...
      go test ./...
      BASH

  - name: Check generated v6 registry
    command: |
      bash -euo pipefail <<'BASH'
      python3 tools/generate_v6_registry.py --check
      BASH

  - name: Check formatting
    command: |
      bash -euo pipefail <<'BASH'
      nix develop -c cargo fmt --check
      BASH

  - name: Check compilation
    command: |
      bash -euo pipefail <<'BASH'
      nix develop -c cargo check --all-targets --all-features
      BASH

  - name: Run Clippy
    command: |
      bash -euo pipefail <<'BASH'
      nix develop -c cargo clippy --all-targets --all-features -- -D warnings
      BASH

  - name: Run tests
    command: |
      bash -euo pipefail <<'BASH'
      nix develop -c cargo test --all-targets --all-features
      BASH

  - name: Check flake
    command: |
      bash -euo pipefail <<'BASH'
      nix flake check --print-build-logs
      BASH

  - name: Build package
    command: |
      bash -euo pipefail <<'BASH'
      nix build --print-build-logs
      BASH
