name: Cachix

when:
  - event: push
    branch: ["main"]

engine: nixery

dependencies:
  nixpkgs:
    - bash
    - nix
    - cachix

environment:
  CACHIX_NAME: lavis
  USER: root

steps:
  - name: Build and publish cache outputs
    command: |
      bash <<'BASH'
      set -euo pipefail
      export CACHIX_AUTH_TOKEN="$cachix"
      nix build --no-link --print-build-logs --print-out-paths \
        | cachix push "$CACHIX_NAME"
      BASH
